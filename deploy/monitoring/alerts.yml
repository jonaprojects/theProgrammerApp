groups:
  - name: the-programmer-api
    interval: 30s
    rules:
      - alert: ProgrammerApiUnavailable
        expr: up{job="the-programmer-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: the-programmer-api
        annotations:
          summary: The Programmer API is unavailable
          description: Prometheus has been unable to scrape the API for two minutes.

      - alert: ProgrammerApiHighErrorRate
        expr: |
          sum(rate(the_programmer_http_requests_total{job="the-programmer-api",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(the_programmer_http_requests_total{job="the-programmer-api"}[5m])), 0.001)
          > 0.02
        for: 10m
        labels:
          severity: critical
          service: the-programmer-api
        annotations:
          summary: API 5xx ratio is above 2%
          description: More than 2% of API requests have failed for ten minutes.

      - alert: ProgrammerApiSlowP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(the_programmer_http_request_duration_seconds_bucket{job="the-programmer-api"}[10m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: the-programmer-api
        annotations:
          summary: API p95 latency is above one second
          description: The rolling ten-minute p95 latency has exceeded one second for ten minutes.

      - alert: ProgrammerApiUnhandledError
        expr: increase(the_programmer_unhandled_errors_total{job="the-programmer-api"}[5m]) > 0
        labels:
          severity: warning
          service: the-programmer-api
        annotations:
          summary: An unhandled API error occurred
          description: Correlate the error ID in structured logs with the external error receiver.

      - alert: ProgrammerErrorReceiverDeliveryFailure
        expr: increase(the_programmer_error_report_delivery_failures_total{job="the-programmer-api"}[10m]) > 0
        labels:
          severity: critical
          service: the-programmer-api
        annotations:
          summary: External error delivery is failing
          description: The API could not deliver one or more sanitized error events to the configured receiver.

      - alert: ProgrammerApiHighMemory
        expr: process_resident_memory_bytes{job="the-programmer-api"} > 536870912
        for: 15m
        labels:
          severity: warning
          service: the-programmer-api
        annotations:
          summary: API resident memory is above 512 MiB
          description: Resident memory has remained above the initial operational threshold for fifteen minutes.
