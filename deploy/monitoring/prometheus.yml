global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: the-programmer-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: [api:3000]
