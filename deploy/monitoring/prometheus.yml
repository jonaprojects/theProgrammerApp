global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s
  external_labels:
    service: the-programmer-api
    environment: __DEPLOYMENT_ENVIRONMENT__

remote_write:
  - name: grafana-cloud
    url: __GRAFANA_CLOUD_PROMETHEUS_URL__
    basic_auth:
      username: __GRAFANA_CLOUD_PROMETHEUS_USERNAME__
      password_file: /tmp/grafana-cloud-prometheus-token
    queue_config:
      capacity: 2500
      min_shards: 1
      max_shards: 2
      max_samples_per_send: 500

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: the-programmer-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: [api:3000]
