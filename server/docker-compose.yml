services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: the_programmer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - programmer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d the_programmer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  programmer_postgres_data:
