name: Production pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  APP_NODE_VERSION: "20"
  API_NODE_VERSION: "22"

jobs:
  app-quality:
    name: App checks and web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.APP_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Export production web bundle
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1

  api-quality:
    name: API checks, migrations, and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: the_programmer_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d the_programmer_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/the_programmer_ci
      DATABASE_SSL: "false"
      CORS_ORIGIN: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.API_NODE_VERSION }}
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - run: pnpm --dir server install --frozen-lockfile
      - run: pnpm --dir server test
      - run: pnpm --dir server content:validate
      - name: Exercise the production database path
        run: |
          pnpm --dir server db:migrate
          pnpm --dir server content:import
      - name: Smoke-test API readiness
        shell: bash
        run: |
          pnpm --dir server start > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

  dependency-security:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.API_NODE_VERSION }}
          cache: npm
      - name: Audit app runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - name: Audit API runtime dependencies
        run: pnpm --dir server audit --prod --audit-level high

  validate-images:
    name: Validate production images
    if: github.event_name == 'pull_request'
    needs: [app-quality, api-quality, dependency-security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          build-args: EXPO_PUBLIC_API_URL=https://api.example.invalid/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  publish-images:
    name: Publish immutable images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [app-quality, api-quality, dependency-security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.names.outputs.api-image }}
      web-image: ${{ steps.names.outputs.web-image }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image names
        id: names
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "api-image=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "web-image=ghcr.io/${repository}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.api-image }}:${{ github.sha }}
            ${{ steps.names.outputs.api-image }}:${{ github.sha }}-staging
            ${{ steps.names.outputs.api-image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Validate production API URL
        shell: bash
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          case "$PRODUCTION_API_URL" in
            https://*/api/v1) ;;
            *) echo "Set PRODUCTION_API_URL to an HTTPS URL ending in /api/v1." >&2; exit 1 ;;
          esac
      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: EXPO_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
          tags: |
            ${{ steps.names.outputs.web-image }}:${{ github.sha }}
            ${{ steps.names.outputs.web-image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate staging API URL
        if: vars.STAGING_DEPLOY_ENABLED == 'true'
        shell: bash
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          case "$STAGING_API_URL" in
            https://*/api/v1) ;;
            *) echo "Set STAGING_API_URL to an HTTPS URL ending in /api/v1." >&2; exit 1 ;;
          esac
      - name: Publish staging web image
        if: vars.STAGING_DEPLOY_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: EXPO_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}
          tags: ${{ steps.names.outputs.web-image }}:${{ github.sha }}-staging
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web-staging
          cache-to: type=gha,mode=max,scope=web-staging

  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_URL }}
    env:
      API_IMAGE: ${{ needs.publish-images.outputs.api-image }}
      WEB_IMAGE: ${{ needs.publish-images.outputs.web-image }}
      IMAGE_TAG: ${{ github.sha }}-staging
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PORT: ${{ vars.STAGING_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      TARGET_API_URL: ${{ vars.STAGING_API_URL }}
      TARGET_WEB_URL: ${{ vars.STAGING_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify staging
        run: bash .github/scripts/deploy-remote.sh
      - name: Run bounded authenticated release journey
        run: node .github/scripts/release-smoke.mjs
        env:
          SMOKE_API_URL: ${{ vars.STAGING_API_URL }}
          SMOKE_WEB_URL: ${{ vars.STAGING_WEB_URL }}
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}

  deploy-production:
    name: Deploy production
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      needs.publish-images.result == 'success' &&
      needs.deploy-staging.result == 'success'
    needs: [publish-images, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}
    env:
      API_IMAGE: ${{ needs.publish-images.outputs.api-image }}
      WEB_IMAGE: ${{ needs.publish-images.outputs.web-image }}
      IMAGE_TAG: ${{ github.sha }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      TARGET_API_URL: ${{ vars.PRODUCTION_API_URL }}
      TARGET_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify production
        run: bash .github/scripts/deploy-remote.sh
