name: Prepare Expo SDK 57 security upgrade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-expo-upgrade.yml

concurrency:
  group: prepare-expo-sdk-57-security-upgrade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Generate and verify compatible dependency upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      UPGRADE_BRANCH: codex/expo-sdk-57-security-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Keep npm peer resolution reproducible
        run: npm config set legacy-peer-deps=true --location=project
      - name: Install Expo SDK 57
        shell: bash
        run: |
          npm pkg delete dependencies.react-native-syntax-highlighter
          set +e
          {
            npm install expo@~57.0.18 react-native-code-highlighter@^1.3.0 react-syntax-highlighter@^15.6.1 &&
            npm install --save-dev --save-exact babel-preset-expo@57.0.9 jest-expo@57.0.5 react-test-renderer@19.2.3 @types/react@19.2.18 @types/react-test-renderer@19.1.0 typescript@5.9.3
          } > "$RUNNER_TEMP/expo-install.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/expo-install.log"
          if (( status != 0 )); then
            node .github/scripts/annotate-command-failure.mjs "$RUNNER_TEMP/expo-install.log" "Install Expo SDK 57 failed"
            exit "$status"
          fi
      - name: Align Expo-managed dependencies
        shell: bash
        run: |
          set +e
          npx expo install --fix --npm > "$RUNNER_TEMP/expo-align.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/expo-align.log"
          if (( status != 0 )); then
            node .github/scripts/annotate-command-failure.mjs "$RUNNER_TEMP/expo-align.log" "Expo dependency alignment failed"
            exit "$status"
          fi
      - name: Install required Reanimated worklets peer
        run: node .github/scripts/run-checked.mjs "Worklets installation failed" npx expo install react-native-worklets --npm
      - name: Migrate Expo SDK 57 application config
        run: node .github/scripts/migrate-expo-57-config.mjs
      - name: Normalize generated npm lockfile
        run: |
          rm -rf node_modules package-lock.json
          node .github/scripts/run-checked.mjs "Lockfile normalization failed" npm install --package-lock-only
      - name: Verify a reproducible clean install
        run: node .github/scripts/run-checked.mjs "Reproducible npm install failed" npm ci
      - name: Run Expo compatibility diagnostics
        run: node .github/scripts/run-checked.mjs "Expo Doctor failed" npx --yes expo-doctor
      - name: Type-check application
        run: node .github/scripts/run-checked.mjs "Application type-check failed" npm run typecheck
      - name: Run bounded application tests
        run: node .github/scripts/run-checked.mjs "Application tests failed" npm run test:ci
      - name: Build production web bundle
        run: node .github/scripts/run-checked.mjs "Production web build failed" npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
      - name: Enforce production dependency security gate
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > "$RUNNER_TEMP/app-audit.json"
          status=$?
          set -e
          node .github/scripts/summarize-audit.mjs "$RUNNER_TEMP/app-audit.json" app
          exit "$status"
      - name: Publish verified review branch
        shell: bash
        run: |
          git diff --quiet -- .npmrc app.json package.json package-lock.json && { echo "Expo reported no upgrade changes." >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPGRADE_BRANCH"
          git add .npmrc app.json package.json package-lock.json
          git commit -m "Upgrade Expo dependencies for security"
          git push origin "$UPGRADE_BRANCH"
          echo "### Verified dependency upgrade" >> "$GITHUB_STEP_SUMMARY"
          echo "Review branch: \`$UPGRADE_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
