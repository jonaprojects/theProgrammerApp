version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    groups:
      expo-app-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns: ["*"]
